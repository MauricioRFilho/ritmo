services:
  gateway:
    build:
      context: .
      dockerfile: services/ai-gateway/Dockerfile
    env_file: ${ENV_FILE:-.env.example}
    ports: ["8000:8000"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    networks: [public, ai_private]
  worker:
    build:
      context: .
      dockerfile: services/ai-gateway/Dockerfile
    command: ["python", "-m", "app.worker"]
    env_file: ${ENV_FILE:-.env.example}
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    networks: [public, ai_private]
  privacy-worker:
    build:
      context: .
      dockerfile: services/ai-gateway/Dockerfile
    command: ["python", "-m", "app.privacy_worker"]
    env_file: ${ENV_FILE:-.env.example}
    restart: unless-stopped
    networks: [public]
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama_models:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [ai_private]
volumes:
  ollama_models:
networks:
  public:
  ai_private:
    internal: true
