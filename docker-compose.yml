services:
  gateway:
    build: ./services/ai-gateway
    env_file: ${ENV_FILE:-.env.example}
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    networks: [public, ai_private]
  worker:
    build: ./services/ai-gateway
    command: ["python", "-m", "app.worker"]
    env_file: ${ENV_FILE:-.env.example}
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    networks: [public, ai_private]
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [ai_private]
volumes:
  ollama_models:
networks:
  public:
  ai_private:
    internal: true
