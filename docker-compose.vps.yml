services:
  gateway:
    ports: !override
      - "127.0.0.1:8000:8000"
    environment:
      ENVIRONMENT: staging
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    environment:
      ENVIRONMENT: staging
      OLLAMA_MAIN_MODEL: qwen3:0.6b
      OLLAMA_LIGHT_MODEL: qwen3:0.6b
    deploy:
      resources:
        limits:
          memory: 512M

  privacy-worker:
    environment:
      ENVIRONMENT: staging
    deploy:
      resources:
        limits:
          memory: 256M

  ollama:
    deploy:
      resources:
        limits:
          memory: 1536M

