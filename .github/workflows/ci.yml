name: Go Live gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ritmo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: Code, build and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/ai-gateway/requirements.txt
      - run: npm ci
      - run: python -m pip install -r services/ai-gateway/requirements.txt
      - run: npm run check

  database:
    name: Migrations and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.75.0
          github-token: ${{ github.token }}
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
